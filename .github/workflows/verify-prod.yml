name: Verify Production Endpoint

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retest listSubjects 3x for consistency
        shell: bash
        run: |
          set +e
          URL="https://urt-platform.vercel.app"
          {
            for i in 1 2 3; do
              echo "--- attempt $i ---"
              timeout 15 curl -s -w "|||HTTP_CODE:%{http_code} TIME:%{time_total}s" "$URL/api/trpc/practice.listSubjects" 2>&1
              echo ""
              sleep 2
            done
          } > /tmp/report.txt 2>&1
          cat /tmp/report.txt
      - name: Post as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "
          import json, os
          body = open('/tmp/report.txt').read() if os.path.exists('/tmp/report.txt') else 'NO REPORT'
          print(json.dumps({'body': body}))
          " > /tmp/payload.json
          curl -s -w "\nCOMMENT_POST_HTTP_CODE:%{http_code}\n" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @/tmp/payload.json
