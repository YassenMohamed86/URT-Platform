name: Diagnose Vercel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List Vercel projects
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects?limit=20" \
            -o /tmp/projects.json
          python3 -c "
          import json
          d = json.load(open('/tmp/projects.json'))
          if 'projects' not in d:
              print('ERROR:', d)
          else:
              for p in d['projects']:
                  print(p['id'], '|', p['name'])
          " > /tmp/step1.txt
          cat /tmp/step1.txt

      - name: Get project env vars (targets only, not values)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          PROJECT_ID=$(python3 -c "
          import json
          d = json.load(open('/tmp/projects.json'))
          for p in d.get('projects', []):
              if 'urt' in p['name'].lower():
                  print(p['id']); break
          ")
          echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$PROJECT_ID/env" \
            -o /tmp/envvars.json
          python3 -c "
          import json
          d = json.load(open('/tmp/envvars.json'))
          if 'envs' not in d:
              print('ERROR:', d)
          else:
              for e in d['envs']:
                  print(e['key'], '| targets:', e.get('target'), '| type:', e.get('type'))
          " > /tmp/step2.txt
          cat /tmp/step2.txt

      - name: Get latest production deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$PROJECT_ID&limit=5&target=production" \
            -o /tmp/deployments.json
          python3 -c "
          import json
          d = json.load(open('/tmp/deployments.json'))
          if 'deployments' not in d:
              print('ERROR:', d)
          else:
              for dep in d['deployments']:
                  print(dep.get('url'), '|', dep.get('state'), '|', dep.get('created'))
          " > /tmp/step3.txt
          cat /tmp/step3.txt
          LATEST_URL=$(python3 -c "
          import json
          d = json.load(open('/tmp/deployments.json'))
          deps = d.get('deployments', [])
          print(deps[0]['url'] if deps else 'NONE')
          ")
          echo "LATEST_URL=$LATEST_URL" >> $GITHUB_ENV

      - name: Test live tRPC endpoints directly
        run: |
          echo "Testing https://$LATEST_URL" > /tmp/step4.txt
          echo "--- exam.listExams ---" >> /tmp/step4.txt
          timeout 20 curl -s -w "\nHTTP_CODE:%{http_code} TIME:%{time_total}s\n" \
            "https://$LATEST_URL/api/trpc/exam.listExams" >> /tmp/step4.txt 2>&1 || echo "CURL TIMED OUT OR FAILED" >> /tmp/step4.txt
          echo "--- practice.listPassages ---" >> /tmp/step4.txt
          timeout 20 curl -s -w "\nHTTP_CODE:%{http_code} TIME:%{time_total}s\n" \
            "https://$LATEST_URL/api/trpc/practice.listPassages?input=%7B%22subject%22%3A%22Biology%22%7D" >> /tmp/step4.txt 2>&1 || echo "CURL TIMED OUT OR FAILED" >> /tmp/step4.txt
          echo "--- practice.listSubjects (control - known working) ---" >> /tmp/step4.txt
          timeout 20 curl -s -w "\nHTTP_CODE:%{http_code} TIME:%{time_total}s\n" \
            "https://$LATEST_URL/api/trpc/practice.listSubjects" >> /tmp/step4.txt 2>&1 || echo "CURL TIMED OUT OR FAILED" >> /tmp/step4.txt
          cat /tmp/step4.txt

      - name: Post all results as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Vercel Diagnosis"
            echo ""
            echo "### Projects"
            cat /tmp/step1.txt 2>/dev/null || echo "(failed)"
            echo ""
            echo "### Env var targets"
            cat /tmp/step2.txt 2>/dev/null || echo "(failed)"
            echo ""
            echo "### Recent production deployments"
            cat /tmp/step3.txt 2>/dev/null || echo "(failed)"
            echo ""
            echo "### Direct endpoint test (latest deployment: $LATEST_URL)"
            cat /tmp/step4.txt 2>/dev/null || echo "(failed)"
          } > /tmp/full_report.txt

          python3 -c "
          import json
          body = open('/tmp/full_report.txt').read()
          print(json.dumps({'body': body}))
          " > /tmp/comment_payload.json

          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @/tmp/comment_payload.json
