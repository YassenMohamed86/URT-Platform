name: Verify Production Endpoint

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check deployed bundle hash + test endpoints
        shell: bash
        run: |
          set +e
          URL="https://urt-platform.vercel.app"
          {
            echo "--- root page raw HTML (checking bundle hash / deploy freshness) ---"
            curl -s "$URL/" 2>&1
            echo ""
            echo "--- response headers (checking x-vercel-id / cache / deployment info) ---"
            curl -s -I "$URL/" 2>&1
            echo ""
            echo "--- api response headers only (fast, no body wait) ---"
            timeout 10 curl -s -I -w "\nHTTP_CODE:%{http_code} TIME:%{time_total}s\n" "$URL/api/trpc/ping" 2>&1
          } > /tmp/report.txt 2>&1
          cat /tmp/report.txt

      - name: Post as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "
          import json, os
          body = open('/tmp/report.txt').read() if os.path.exists('/tmp/report.txt') else 'NO REPORT'
          print(json.dumps({'body': body}))
          " > /tmp/payload.json
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @/tmp/payload.json
