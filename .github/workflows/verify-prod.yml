name: Verify Production Endpoint

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Full verification with corrected input encoding
        shell: bash
        run: |
          set +e
          URL="https://urt-platform.vercel.app"
          {
            echo "--- ping ---"
            timeout 15 curl -s -w "|||HTTP_CODE:%{http_code} TIME:%{time_total}s" "$URL/api/trpc/ping" 2>&1
            echo ""; echo ""

            echo "--- exam.listExams ---"
            timeout 15 curl -s -w "|||HTTP_CODE:%{http_code} TIME:%{time_total}s" "$URL/api/trpc/exam.listExams" 2>&1 | head -c 300
            echo ""; echo ""

            echo "--- practice.listSubjects (fixed version) ---"
            timeout 15 curl -s -w "|||HTTP_CODE:%{http_code} TIME:%{time_total}s" "$URL/api/trpc/practice.listSubjects" 2>&1
            echo ""; echo ""

            echo "--- practice.listPassages Biology (fixed version + correct superjson input encoding) ---"
            timeout 15 curl -s -w "|||HTTP_CODE:%{http_code} TIME:%{time_total}s" "$URL/api/trpc/practice.listPassages?input=%7B%22json%22%3A%20%7B%22subject%22%3A%20%22Biology%22%7D%7D" 2>&1 | head -c 500
            echo ""
          } > /tmp/report.txt 2>&1
          cat /tmp/report.txt

      - name: Post as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "
          import json, os
          body = open('/tmp/report.txt').read() if os.path.exists('/tmp/report.txt') else 'NO REPORT'
          print(json.dumps({'body': body}))
          " > /tmp/payload.json
          curl -s -w "\nPOST_STATUS:%{http_code}\n" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @/tmp/payload.json
