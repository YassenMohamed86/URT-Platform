name: Verify Production Endpoint

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Test isolation — non-tRPC route vs tRPC route
        shell: bash
        run: |
          set +e
          URL="https://urt-platform.vercel.app"
          {
            echo "Testing $URL"
            echo ""

            echo "--- /api/nonexistent-path (hits app.all 404 catch-all, bypasses tRPC entirely) ---"
            START=$(date +%s%N)
            OUT=$(timeout 20 curl -s -w "|||HTTP_CODE:%{http_code}|||TIME:%{time_total}s" "$URL/api/nonexistent-path" 2>&1)
            CODE=$?
            END=$(date +%s%N)
            echo "curl exit code: $CODE, wall clock: $(( (END-START)/1000000 ))ms"
            echo "output: $OUT"
            echo ""

            echo "--- /uploads/file/1 (hits boot.ts direct Hono route, no tRPC, DOES touch DB) ---"
            START=$(date +%s%N)
            OUT=$(timeout 20 curl -s -w "|||HTTP_CODE:%{http_code}|||TIME:%{time_total}s" "$URL/uploads/file/1" 2>&1)
            CODE=$?
            END=$(date +%s%N)
            echo "curl exit code: $CODE, wall clock: $(( (END-START)/1000000 ))ms"
            echo "output: $OUT"
            echo ""

            echo "--- / (static SPA shell, known working per earlier web_fetch) ---"
            START=$(date +%s%N)
            OUT=$(timeout 20 curl -s -w "|||HTTP_CODE:%{http_code}|||TIME:%{time_total}s" "$URL/" 2>&1)
            CODE=$?
            END=$(date +%s%N)
            echo "curl exit code: $CODE, wall clock: $(( (END-START)/1000000 ))ms"
            echo "first 200 chars: ${OUT:0:200}"
            echo ""

            echo "--- HEAD request to /api/trpc/ping (just headers, no body wait) ---"
            START=$(date +%s%N)
            OUT=$(timeout 20 curl -s -I -w "|||HTTP_CODE:%{http_code}|||TIME:%{time_total}s" "$URL/api/trpc/ping" 2>&1)
            CODE=$?
            END=$(date +%s%N)
            echo "curl exit code: $CODE, wall clock: $(( (END-START)/1000000 ))ms"
            echo "output: $OUT"
          } > /tmp/report.txt 2>&1

          cat /tmp/report.txt

      - name: Post as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "
          import json, os
          body = open('/tmp/report.txt').read() if os.path.exists('/tmp/report.txt') else 'NO REPORT FILE'
          print(json.dumps({'body': body}))
          " > /tmp/payload.json
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @/tmp/payload.json
