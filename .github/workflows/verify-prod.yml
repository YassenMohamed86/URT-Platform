name: Verify Production Endpoint

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test with cache-busting + check response headers
        shell: bash
        run: |
          set +e
          URL="https://urt-platform.vercel.app"
          TS=$(date +%s%N)
          {
            echo "--- practice.listSubjects with cache-buster (_cb=$TS) ---"
            timeout 15 curl -s -w "|||HTTP_CODE:%{http_code} TIME:%{time_total}s" "$URL/api/trpc/practice.listSubjects?_cb=$TS" 2>&1
            echo ""; echo ""

            echo "--- response headers only (checking for x-vercel-cache) ---"
            timeout 15 curl -s -I "$URL/api/trpc/practice.listSubjects?_cb=$TS-b" 2>&1
            echo ""

            echo "--- POST instead of GET (tRPC also accepts POST for queries in some configs) ---"
            timeout 15 curl -s -X POST -H "Content-Type: application/json" -w "|||HTTP_CODE:%{http_code}" \
              -d '{}' "$URL/api/trpc/practice.listSubjects" 2>&1
          } > /tmp/report.txt 2>&1
          cat /tmp/report.txt

      - name: Post as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "
          import json, os
          body = open('/tmp/report.txt').read() if os.path.exists('/tmp/report.txt') else 'NO REPORT'
          print(json.dumps({'body': body}))
          " > /tmp/payload.json
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @/tmp/payload.json
