name: Verify Production Endpoint

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Test production tRPC endpoints
        shell: bash
        run: |
          set +e
          URL="https://urt-platform.vercel.app"
          {
            echo "Testing $URL"
            echo ""

            echo "--- ping (trivial, no DB) attempt 1 ---"
            START=$(date +%s%N)
            OUT=$(timeout 65 curl -s -w "|||HTTP_CODE:%{http_code}|||TIME:%{time_total}s" "$URL/api/trpc/ping" 2>&1)
            CODE=$?
            END=$(date +%s%N)
            echo "curl exit code: $CODE"
            echo "wall clock: $(( (END-START)/1000000 ))ms"
            echo "output: $OUT"
            echo ""

            echo "--- ping attempt 2 (should be warm) ---"
            START=$(date +%s%N)
            OUT=$(timeout 20 curl -s -w "|||HTTP_CODE:%{http_code}|||TIME:%{time_total}s" "$URL/api/trpc/ping" 2>&1)
            CODE=$?
            END=$(date +%s%N)
            echo "curl exit code: $CODE"
            echo "wall clock: $(( (END-START)/1000000 ))ms"
            echo "output: $OUT"
            echo ""

            echo "--- exam.listExams (DB query) ---"
            START=$(date +%s%N)
            OUT=$(timeout 65 curl -s -w "|||HTTP_CODE:%{http_code}|||TIME:%{time_total}s" "$URL/api/trpc/exam.listExams" 2>&1)
            CODE=$?
            END=$(date +%s%N)
            echo "curl exit code: $CODE"
            echo "wall clock: $(( (END-START)/1000000 ))ms"
            echo "output: $OUT"
            echo ""

            echo "--- practice.listSubjects (DB query) ---"
            START=$(date +%s%N)
            OUT=$(timeout 65 curl -s -w "|||HTTP_CODE:%{http_code}|||TIME:%{time_total}s" "$URL/api/trpc/practice.listSubjects" 2>&1)
            CODE=$?
            END=$(date +%s%N)
            echo "curl exit code: $CODE"
            echo "wall clock: $(( (END-START)/1000000 ))ms"
            echo "output: $OUT"
          } > /tmp/report.txt 2>&1

          cat /tmp/report.txt

      - name: Post as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "
          import json
          body = open('/tmp/report.txt').read() if __import__('os').path.exists('/tmp/report.txt') else 'NO REPORT FILE — step itself crashed'
          print(json.dumps({'body': body}))
          " > /tmp/payload.json
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @/tmp/payload.json
