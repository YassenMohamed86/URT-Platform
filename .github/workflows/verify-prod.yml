name: Verify Production Endpoint

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Run verify-counts.ts DIRECTLY (bypassing Vercel entirely)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
        run: npx tsx db/verify-counts.ts > /tmp/report.txt 2>&1 || echo "SCRIPT FAILED, exit $?" >> /tmp/report.txt
      - name: Show report
        if: always()
        run: cat /tmp/report.txt
      - name: Post as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "
          import json, os
          body = open('/tmp/report.txt').read() if os.path.exists('/tmp/report.txt') else 'NO REPORT'
          print(json.dumps({'body': 'DIRECT (non-Vercel) query test:\n\n' + body}))
          " > /tmp/payload.json
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @/tmp/payload.json
