name: Seed Practice Data

on:
  push:
    branches: [main]
    paths:
      - "db/practice-*.json"
      - "db/seed-biology.ts"
      - "db/seed-physics.ts"
      - "db/seed-chemistry.ts"
      - ".github/workflows/seed-practice.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Seed Biology
        id: seedstep
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
        run: npm run db:seed-biology > /tmp/seed_output.txt 2>&1 || echo "FAILED" > /tmp/seed_failed.txt
        continue-on-error: true

      - name: Show Biology output
        if: always()
        run: cat /tmp/seed_output.txt || echo "no output captured"

      - name: Seed Physics
        id: seedstep_physics
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
        run: npm run db:seed-physics > /tmp/seed_output_physics.txt 2>&1 || echo "FAILED" > /tmp/seed_failed_physics.txt
        continue-on-error: true

      - name: Show Physics output
        if: always()
        run: cat /tmp/seed_output_physics.txt || echo "no output captured"

      - name: Seed Chemistry
        id: seedstep_chemistry
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
        run: npm run db:seed-chemistry > /tmp/seed_output_chemistry.txt 2>&1 || echo "FAILED" > /tmp/seed_failed_chemistry.txt
        continue-on-error: true

      - name: Show Chemistry output
        if: always()
        run: cat /tmp/seed_output_chemistry.txt || echo "no output captured"

      - name: Post as commit comment if failed
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f /tmp/seed_failed.txt ]; then
            python3 -c "
            import json
            body = open('/tmp/seed_output.txt').read()[-6000:]
            print(json.dumps({'body': 'Seed Biology FAILED:\n\n' + body}))
            " > /tmp/payload.json
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
              -d @/tmp/payload.json
          fi
          if [ -f /tmp/seed_failed_physics.txt ]; then
            python3 -c "
            import json
            body = open('/tmp/seed_output_physics.txt').read()[-6000:]
            print(json.dumps({'body': 'Seed Physics FAILED:\n\n' + body}))
            " > /tmp/payload_physics.json
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
              -d @/tmp/payload_physics.json
          fi
          if [ -f /tmp/seed_failed_chemistry.txt ]; then
            python3 -c "
            import json
            body = open('/tmp/seed_output_chemistry.txt').read()[-6000:]
            print(json.dumps({'body': 'Seed Chemistry FAILED:\n\n' + body}))
            " > /tmp/payload_chemistry.json
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
              -d @/tmp/payload_chemistry.json
          fi
          if [ -f /tmp/seed_failed.txt ] || [ -f /tmp/seed_failed_physics.txt ] || [ -f /tmp/seed_failed_chemistry.txt ]; then
            exit 1
          fi
